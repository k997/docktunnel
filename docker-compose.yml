# DockTunnel - Cloudflare Tunnel Docker Controller
# 生产部署配置。状态目录使用命名卷持久化，容器重建后
# retention / 补偿队列 / flapping 状态不丢失。

services:
  docktunnel:
    image: ghcr.io/k997/docktunnel:latest
    container_name: docktunnel
    restart: unless-stopped

    # 挂载 Docker socket（只读）用于监听容器事件
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 命名卷：首次创建时继承镜像内 /var/lib/docktunnel 的属主（uid 10001），
      # 应用内非 root 用户可直接读写
      - docktunnel-state:/var/lib/docktunnel
      - ./config.yaml:/etc/docktunnel/config.yaml:ro

    # 环境变量（覆盖配置文件；命名规则见 README「环境变量配置」章节）
    environment:
      - DOCKTUNNEL_LOG_LEVEL=info
      # - DOCKTUNNEL_CLOUDFLARE_ACCOUNT_ID=${DOCKTUNNEL_CLOUDFLARE_ACCOUNT_ID}
      # - DOCKTUNNEL_CLOUDFLARE_API_TOKEN=${DOCKTUNNEL_CLOUDFLARE_API_TOKEN}

    # 资源限制（按需调整）
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.25'

    # 健康检查：镜像为 alpine，自带 busybox wget；
    # /healthz 是真实存活信号（metrics 服务，默认 127.0.0.1:9100）
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9100/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # 日志轮转
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  docktunnel-state:
