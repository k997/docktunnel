name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (fmt / vet / race)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.24.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Check formatting
        run: |
          diff=$(gofmt -s -d cmd internal pkg tests)
          if [ -n "$diff" ]; then
            echo "gofmt found unformatted files:"; echo "$diff"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Unit tests (with race detector)
        run: go test -race ./...

      - name: Build binary
        run: go build -trimpath -o /tmp/docktunnel ./cmd/docktunnel

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --build-arg VERSION=${GITHUB_REF_NAME} \
            --build-arg GIT_COMMIT=${GITHUB_SHA} \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t docktunnel:ci .
