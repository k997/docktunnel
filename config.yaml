# 日志配置
log:
  # 日志级别, 支持: debug, info, warn, error
  level: info
  # 日志格式, 支持: text, json
  format: text

# Cloudflare 配置
cloudflare:
  # Cloudflare 账户 ID
  accountId: ""
  # Cloudflare API Token (推荐使用这种方式认证)
  apiToken: ""
  # 可选: 预创建的 Tunnel ID (如果为空，将自动创建一个新的)
  tunnelId: ""
  # 可选: Tunnel 名称 (当tunnelId为空时使用，如果此项也为空则使用系统内置名称)
  tunnelName: ""

# 清理配置
cleanup:
  # 程序退出时是否清理资源 (true/false)
  # 默认值为true，即默认清理资源
  onExit: true