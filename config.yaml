# 日志配置
log:
  # 日志级别, 支持: debug, info, warn, error
  level: info
  # 日志格式, 支持: text, json
  format: text

# Cloudflare 配置
cloudflare:
  # Cloudflare 账户 ID
  accountId: ""
  # Cloudflare API Token (推荐使用这种方式认证)
  apiToken: ""
  # 可选: 预创建的 Tunnel ID (如果为空，将自动创建一个新的)
  tunnelId: ""
  # 可选: Tunnel 名称 (当tunnelId为空时使用，如果此项也为空则使用系统内置名称)
  tunnelName: "DockTunnel"
  # Catch-all 服务配置 (当没有匹配的规则时使用的默认服务)
  # 默认值为 http_status:404，也可以设置为其他服务如 http://localhost:8080
  catchAll: "http_status:404"
  # API调用相关配置
  rateLimit: 10              # 每秒最大请求数
  maxRetries: 3              # 最大重试次数
  retryDelay: 1s             # 初始重试延迟
  maxRetryDelay: 30s         # 最大重试延迟

controller:
  # 容器抖动检测配置
  flappingWindow: 60s        # 抖动检测窗口
  flappingThreshold: 5       # 抖动阈值（重启次数）
  coolingPeriod: 300s        # 基础冷却期
  maxCoolingPeriod: 1800s    # 最大冷却期
  debounceDuration: 2s       # 防抖延迟

# 清理配置
cleanup:
  # 程序退出时是否清理资源 (true/false)
  # 默认值为true，即默认清理资源
  onExit: true
# 全局默认配置 (当容器标签未指定时使用)
# 4层优先级: DockTunnel标签 > Traefik标签 > 自动检测 > 全局默认
defaults:
  scheme: http    # 默认scheme (http, https, tcp) - 与Traefik保持一致
  port: 80        # 默认端口
  path: ""        # 默认路径 (留空表示根路径)
